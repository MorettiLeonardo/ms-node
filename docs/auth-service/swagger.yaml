openapi: 3.0.3
info:
  title: LearnS Auth Microservice API
  description: Authentication microservice built with Fastify, TypeScript, Prisma, and MySQL.
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local Development Server
  - url: https://auth.learns.example.com
    description: Production Server
tags:
  - name: Health
    description: Service health operations
  - name: Auth
    description: Authentication and account lifecycle operations
paths:
  /health:
    get:
      tags:
        - Health
      summary: Service health check
      description: Returns current uptime and health status of the auth microservice
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /register:
    post:
      tags:
        - Auth
      summary: Register a new account
      description: Creates a new user account with hashed password and returns active session with JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /login:
    post:
      tags:
        - Auth
      summary: Authenticate and obtain tokens
      description: Validates email and password, returns new JWT access token and refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Issues a new JWT access token and rotating refresh token using an active refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid, revoked, or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me:
    get:
      tags:
        - Auth
      summary: Get authenticated account profile
      description: Returns profile information of currently logged in user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /logout:
    post:
      tags:
        - Auth
      summary: Revoke refresh tokens and logout
      description: Revokes the active refresh token or all refresh tokens belonging to the authenticated account
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - service
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          example: '2026-09-14T21:00:00.000Z'
        service:
          type: string
          example: auth-service
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: Password123!
        role:
          type: string
          default: user
          example: user
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: Password123!
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: 9a8b7c6d5e4f3a2b1c0d
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          example: 9a8b7c6d5e4f3a2b1c0d
    AccountProfile:
      type: object
      required:
        - id
        - email
        - role
        - is_active
        - created_at
      properties:
        id:
          type: string
          example: clv1234567890abcdef
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          example: user
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-09-14T21:00:00.000Z'
    AuthTokens:
      type: object
      required:
        - access_token
        - refresh_token
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: 9a8b7c6d5e4f3a2b1c0d
        expires_in:
          type: number
          example: 900
    AuthSessionResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          required:
            - account
            - tokens
          properties:
            account:
              $ref: '#/components/schemas/AccountProfile'
            tokens:
              $ref: '#/components/schemas/AuthTokens'
    TokensResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AuthTokens'
    ProfileResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AccountProfile'
    MessageResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Logged out successfully
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Descriptive error message
